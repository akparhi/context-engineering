#:schema https://developers.openai.com/codex/config-schema.json
# Personal default; machine-specific desktop preferences and trust entries below.
model = "gpt-6-astra"
model_reasoning_effort = "low"
model_verbosity = "low"
service_tier = "default"
personality = "pragmatic"

# Match the existing unattended setup: no approval prompts and unrestricted local execution.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Compact at 256k total tokens; leave the model’s actual context capacity at its default.
model_auto_compact_token_limit = 256000
model_auto_compact_token_limit_scope = "total"

# Use fresh native web results, independently of ChatGPT connectors.
web_search = "live"

# Enable hooks, agents, plugins and UI automation; disable app connectors and remote catalog discovery.
notify = ["/Users/akparhi/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[features]
hooks = true
multi_agent = true
plugins = true
apps = false
# Hide remote catalog discovery; cached, explicitly enabled plugins can still load.
remote_plugin = false
recommended_plugins = false
# Do not auto-install MCP dependencies requested by a skill.
skill_mcp_dependency_install = false
browser_use = true
computer_use = true
# Keep the machine awake while a turn is running.
prevent_idle_sleep = true

# Prefer long event waits and expose explicit worker model/effort selection.
# Keep a 60-second floor for runtimes that cap blocking waits; instructions still take precedence.
[features.multi_agent_v2]
enabled = true
expose_spawn_agent_model_overrides = true
min_wait_timeout_ms = 60000
default_wait_timeout_ms = 600000
max_wait_timeout_ms = 3600000

# Disable ChatGPT connector tools by default; explicit per-app settings can override this.
[apps._default]
enabled = false

# Opt out of Codex usage analytics.
[analytics]
enabled = false

# Disable the /feedback submission feature.
[feedback]
enabled = false

# Cap parallel children and choose their fallback model/effort; agents/*.toml specialize roles.
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"

# Start Context7 locally through npx for current library documentation; allow 30s startup.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 30

# Terminal UI: show model/context/quota status; custom sound hooks replace TUI notifications.
[tui]
notifications = false
status_line = ["model-with-reasoning", "context-remaining", "context-window-size", "five-hour-limit", "weekly-limit"]

# CLI-managed model-availability notice state; does not select the model or reasoning effort.
[tui.model_availability_nux]
gpt-6-astra = 1

# Load installed Superpowers engineering skills, even with remote catalog browsing disabled.
[plugins."superpowers@openai-curated-remote"]
enabled = true

# Disable bundled app integration tools.
[plugins."codex-app-tools@openai-bundled"]
enabled = false

# Disable bundled website building and hosting workflows.
[plugins."sites@openai-bundled"]
enabled = true

# Enable the bundled browser automation plugin.
[plugins."browser@openai-bundled"]
enabled = true

# Enable unified browser/computer automation tools.
[plugins."unified-computer-use@openai-bundled"]
enabled = true

# Disable bundled interactive visualization workflows.
[plugins."visualize@openai-bundled"]
enabled = true

# Keep the separate computer-use plugin disabled.
[plugins."computer-use@openai-bundled"]
enabled = false

# Disable bundled Word/document artifact workflows.
[plugins."documents@openai-primary-runtime"]
enabled = false

# Disable bundled PDF artifact workflows; the standalone PDF skill is enabled below.
[plugins."pdf@openai-primary-runtime"]
enabled = true

# Disable bundled spreadsheet and live Excel workflows.
[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

# Disable bundled reusable artifact-template creation.
[plugins."template-creator@openai-primary-runtime"]
enabled = false

# Disable bundled PowerPoint/Slides workflows.
[plugins."presentations@openai-primary-runtime"]
enabled = false

# Disable the remote plugin discovery and account-management skill bundle.
[plugins."plugin-management@openai-curated-remote"]
enabled = false

# Enable the standalone local PDF skill.
[[skills.config]]
path = "/Users/akparhi/.codex/skills/pdf/SKILL.md"
enabled = true

# Trust this directory itself; nested Git repositories need explicit entries below.
[projects."/Users/akparhi/Projects"]
trust_level = "trusted"

