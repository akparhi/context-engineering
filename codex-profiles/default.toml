# Preserve desktop UI, composer, notifications, Git and worktree preferences for this machine.
[desktop]
appearanceTheme = "system"
appearanceLightCodeThemeId = "codex"
sansFontSize = 16
codeFontSize = 15
usePointerCursors = true
followUpQueueMode = "steer"
composerEnterBehavior = "cmdIfMultiline"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = "akparhi/"
git-always-force-push = false
conversationDetailMode = "STEPS_COMMANDS"
worktree-keep-count = 3
open-link-in-target-preference = "in-app-browser"
ambient-suggestions-enabled = false
git-pull-request-merge-method = "squash"
git-create-pull-request-as-draft = false
reviewDelivery = "inline"
worktree-upstream-refresh-mode = "best-effort"
selected-avatar-id = "rocky"
avatar-overlay-mascot-width-px = 115
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "persistent"]
dictationDictionary = []
dock-icon-preference = "codex-system"
appearanceDiffMarkerStyle = "color"
show-context-window-usage = true
notifications-permissions-enabled = true
toys-audio-visualizer-enabled = false
appearanceDarkCodeThemeId = "raycast"

# Light app-shell palette (chrome means window/UI surfaces, not the Chrome browser).
[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
accentSource = "chatgpt"
contrast = 60
ink = "#0d0d0d"
opaqueWindows = false
surface = "#f3f3f3"

# Light-mode font overrides; empty means use app defaults.
[desktop.appearanceLightChromeTheme.fonts]

# Light-mode colors for added/removed lines and skill indicators.
[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"

# Dark app-shell palette, including text, surfaces, accent and transparency.
[desktop.appearanceDarkChromeTheme]
accent = "#ff6363"
accentSource = "custom"
contrast = 60
ink = "#fefefe"
opaqueWindows = false
surface = "#101010"

# Dark-mode code and interface font overrides.
[desktop.appearanceDarkChromeTheme.fonts]
code = '"Jetbrains Mono"'
ui = "Inter"

# Dark-mode colors for added/removed lines and skill indicators.
[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#59d499"
diffRemoved = "#ff6363"
skill = "#cf2f98"

